name: publish

# Время в UTC. Москва = UTC+3, то есть 06:00 UTC = 09:00 МСК.
# Чтобы добавить слот: новая строка cron здесь + запись в SLOT_MAP ниже + слот в config.json.
# GitHub может задержать запуск по расписанию на 5-30 минут в часы пик — это нормально.
on:
  schedule:
    - cron: "0 6 * * *"     # morning → 09:00 МСК
    - cron: "0 16 * * *"    # evening → 19:00 МСК
  workflow_dispatch:
    inputs:
      slot:
        description: "Слот из config.json"
        default: "morning"
      topic:
        description: "Тема (пусто = следующая по очереди)"
        default: ""
      upload:
        description: "Выкладывать на YouTube"
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # нужно, чтобы коммитить state.json с очередью тем
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Определить слот
        id: slot
        env:
          SLOT_MAP: |
            {"0 6 * * *": "morning", "0 16 * * *": "evening"}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.slot }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          sched = os.environ.get("SCHEDULE") or ""
          slot = json.loads(os.environ["SLOT_MAP"]).get(sched) or os.environ.get("MANUAL_SLOT") or "morning"
          print(f"name={slot}")
          PY

      - name: Собрать и выложить ролик
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          ARGS="--slot ${{ steps.slot.outputs.name }}"
          [ -n "${{ inputs.topic }}" ] && ARGS="$ARGS --topic '${{ inputs.topic }}'"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.upload }}" = "true" ]; then
            ARGS="$ARGS --upload"
          fi
          eval python3 run.py $ARGS

      - name: Сохранить ролик как артефакт
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-${{ steps.slot.outputs.name }}-${{ github.run_number }}
          path: |
            out/**/video.mp4
            out/**/thumbnail.jpg
            out/**/metadata.json
            out/**/script.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Запомнить очередь тем
        if: success()
        run: |
          git config user.name "speakloud-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "state: ${{ steps.slot.outputs.name }} run ${{ github.run_number }}"
          git push
